openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: FluencyFlow API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: conversations
    description: Chat conversation management
  - name: vocabulary
    description: Vocabulary vault management
  - name: sessions
    description: Session management and summaries
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /conversations:
    post:
      operationId: createConversation
      tags: [conversations]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{id}:
    get:
      operationId: getConversation
      tags: [conversations]
      summary: Get a conversation with its messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationWithMessages"
        "404":
          description: Not found

  /conversations/{id}/messages:
    post:
      operationId: sendMessage
      tags: [conversations]
      summary: Send a message and get AI tutor response (SSE streaming)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageBody"
      responses:
        "200":
          description: SSE stream of AI response
          content:
            text/event-stream:
              schema:
                type: string

  /conversations/{id}/vocabulary:
    get:
      operationId: getVocabulary
      tags: [vocabulary]
      summary: Get vocabulary vault for a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vocabulary entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VocabularyEntry"

  /conversations/{id}/summary:
    get:
      operationId: getSessionSummary
      tags: [sessions]
      summary: Get end-of-session summary with mistakes and new words
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummary"

  /conversations/{id}/fluency-score:
    get:
      operationId: getFluencyScore
      tags: [conversations]
      summary: Get current fluency vibe score for the conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Fluency score data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FluencyScore"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    CreateConversationBody:
      type: object
      properties:
        scenario:
          type: string
          enum: [general, job_interview, ordering_coffee, startup_pitch]
      required:
        - scenario

    Conversation:
      type: object
      properties:
        id:
          type: integer
        scenario:
          type: string
        createdAt:
          type: string
          format: date-time
        fluencyScore:
          type: number
          minimum: 1
          maximum: 10
      required:
        - id
        - scenario
        - createdAt
        - fluencyScore

    Message:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        originalInput:
          type: string
          nullable: true
        polishedVersion:
          type: string
          nullable: true
        correction:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt

    ConversationWithMessages:
      type: object
      properties:
        conversation:
          $ref: "#/components/schemas/Conversation"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
      required:
        - conversation
        - messages

    SendMessageBody:
      type: object
      properties:
        content:
          type: string
        inputLanguage:
          type: string
          enum: [english, hindi_hinglish]
      required:
        - content
        - inputLanguage

    VocabularyEntry:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        word:
          type: string
        type:
          type: string
          enum: [word, idiom, phrase]
        definition:
          type: string
        exampleSentence:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - word
        - type
        - definition
        - createdAt

    SessionSummary:
      type: object
      properties:
        totalMessages:
          type: integer
        averageFluencyScore:
          type: number
        mistakesToAvoid:
          type: array
          items:
            type: string
        newWordsLearned:
          type: array
          items:
            $ref: "#/components/schemas/VocabularyEntry"
        topicsDiscussed:
          type: array
          items:
            type: string
        encouragement:
          type: string
      required:
        - totalMessages
        - averageFluencyScore
        - mistakesToAvoid
        - newWordsLearned
        - topicsDiscussed
        - encouragement

    FluencyScore:
      type: object
      properties:
        score:
          type: number
          minimum: 1
          maximum: 10
        trend:
          type: string
          enum: [improving, stable, needs_work]
        recentScores:
          type: array
          items:
            type: number
      required:
        - score
        - trend
        - recentScores
